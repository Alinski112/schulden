<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <meta name="theme-color" content="#dcecf7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Schulden">
  <title>Schuldenberg</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main>
    <header class="hero">
      <h1 id="open-label">Noch offen</h1>
      <p id="open-amount" class="open-amount">0,00 €</p>
      <p id="status" class="status"></p>

      <svg class="mountain" viewBox="0 0 360 180" aria-hidden="true">
        <defs>
          <clipPath id="peak">
            <path d="M0 180 L92 76 L128 104 L196 8 L262 96 L292 72 L360 180 Z"/>
          </clipPath>
        </defs>
        <g clip-path="url(#peak)">
          <rect class="rock" width="360" height="180"/>
          <path class="snow" d="M196 8 L232 56 L214 50 L200 64 L184 48 L164 54 Z"/>
          <rect id="mountain-fill" class="meadow" y="180" width="360" height="180"/>
        </g>
        <path id="flag" class="flag" d="M196 10 V0 L216 5 L196 10 Z"/>
      </svg>
    </header>

    <p id="message" class="message" role="status"></p>

    <dl class="totals">
      <div><dt>Zurückgezahlt</dt><dd id="paid-amount" class="payment">0,00 €</dd></div>
      <div><dt>Insgesamt geliehen</dt><dd id="debt-amount">0,00 €</dd></div>
    </dl>

    <section aria-labelledby="months-title">
      <h2 id="months-title">Rückzahlungen der letzten 6 Monate</h2>
      <ol id="months" class="months"></ol>
    </section>

    <section aria-labelledby="history-title">
      <h2 id="history-title">Verlauf</h2>
      <p id="empty" class="empty">Noch nichts eingetragen. Tippe unten auf „Schuld“.</p>
      <ul id="history" class="history"></ul>
    </section>

    <section aria-labelledby="data-title">
      <h2 id="data-title">Deine Daten</h2>
      <p class="hint">Alles bleibt nur auf diesem Gerät. Sichere ab und zu eine Datei.</p>
      <div class="data-actions">
        <button type="button" id="export">Sichern</button>
        <button type="button" id="import">Sicherung laden</button>
        <button type="button" id="wipe" class="danger">Alles löschen</button>
      </div>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </section>
  </main>

  <nav class="actions" aria-label="Eintragen">
    <button type="button" id="add-debt" class="secondary">+ Schuld</button>
    <button type="button" id="add-payment" class="primary">+ Rückzahlung</button>
  </nav>

  <dialog id="dialog" aria-labelledby="form-title">
    <form id="form" novalidate>
      <h2 id="form-title"></h2>
      <label>Betrag in Euro
        <input id="amount" inputmode="decimal" autocomplete="off" placeholder="0,00" required>
      </label>
      <label>Datum
        <input id="date" type="date" required>
      </label>
      <label>Wofür? (optional)
        <input id="note" maxlength="80" autocomplete="off">
      </label>
      <p id="form-error" class="form-error" role="alert"></p>
      <div class="form-actions">
        <button type="button" id="cancel" class="secondary">Abbrechen</button>
        <button type="submit" class="primary">Speichern</button>
      </div>
    </form>
  </dialog>
</body>
</html>
